name: Bug report
description: Something in the A330-200 does not work as described.
title: "[Bug] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. This is a public beta, so reports from Windows, macOS and Linux are all welcome.
        Everything you post here is public. Never post your SimBrief Pilot ID.

        **Attach the debug report.** In the tablet, open Options > Support > Save debug report, then drag the .zip it creates
        (in `Output/Calibra A330-200/debug`) into the last box. Look through the files before attaching.
  - type: input
    id: version
    attributes:
      label: Package version
      description: The PLUGIN line on the MCDU, page A/C CONFIG. The debug report also has it.
      placeholder: "1.0.0-beta.2"
    validations:
      required: false
  - type: dropdown
    id: xplane
    attributes:
      label: X-Plane version
      options:
        - "12.4.4"
        - "12.4.3"
        - Other (not tested by us, say which one below)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine in use
      options:
        - Rolls-Royce Trent 700 (included)
        - GE CF6-80E1 (Carda mod)
        - PW4000 (Carda mod)
    validations:
      required: true
  - type: dropdown
    id: carda
    attributes:
      label: Are the "GE Engines" / "PW Engines" folders installed?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: input
    id: livery
    attributes:
      label: Livery folder name
      description: The exact name of the livery folder, including the RR / GE / PW tag.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was the aircraft installed?
      options:
        - Folder "Calibra A330-200" directly in X-Plane 12/Aircraft/ (as in the README)
        - Folder inside another folder in Aircraft/ (for example inside "Laminar Research")
        - Over or inside the default A330-300 folder
        - Other (explain below)
    validations:
      required: true
  - type: dropdown
    id: default_a333
    attributes:
      label: Does it also happen on the default A330-300?
      options:
        - Not tested
        - "No"
        - "Yes"
    validations:
      required: true
  - type: dropdown
    id: plugins_off
    attributes:
      label: Does it still happen with third-party plugins and scripts disabled?
      options:
        - Not tested
        - "Yes"
        - "No"
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Flight phase
      placeholder: "Cold and dark, taxi, take-off, climb, cruise, descent, approach, landing"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Debug report (.zip) and screenshots
      description: >
        Drag here the .zip from tablet > Options > Support > Save debug report, saved right after the problem
        happened, without reloading the aircraft or closing X-Plane (it covers the last 30 minutes), and screenshots
        if they help. No tablet? Bind the command a330v3/debug/save to a key in X-Plane Settings > Keyboard.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using the official package, without modified files.
          required: true
        - label: I searched the existing issues.
          required: true
