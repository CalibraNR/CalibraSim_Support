name: Installation or usage help
description: You are not sure how to install or use something.
title: "[Help] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Everything you post here is public. Never post your SimBrief Pilot ID.
        If you attach Log.txt, delete the line that contains `SimBrief Pilot ID` first.
  - type: input
    id: version
    attributes:
      label: Package version
      description: From version.txt in the aircraft folder.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: xplane
    attributes:
      label: X-Plane version
      placeholder: "12.4.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation
        - GE / PW engines
        - SimBrief on the MCDU
        - Liveries and paint kit
        - Something else
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you did, what you saw, and what you were trying to do.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Log.txt and screenshots (optional)
