name: Installation or usage help
description: You are not sure how to install or use something.
title: "[Help] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Everything you post here is public. Never post your SimBrief Pilot ID.
        If something is not working, attach the debug report: in the tablet, Options > Support > Save debug report, then
        the .zip in `Output/Calibra A330-200/debug`. Look through the files before attaching.
  - type: input
    id: version
    attributes:
      label: Package version
      description: The PLUGIN line on the MCDU, page A/C CONFIG, if you can see it.
      placeholder: "1.0.0-beta.2"
    validations:
      required: false
  - type: input
    id: xplane
    attributes:
      label: X-Plane version
      placeholder: "12.4.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation
        - GE / PW engines
        - SimBrief on the MCDU
        - Liveries and paint kit
        - Something else
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you did, what you saw, and what you were trying to do.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Debug report (.zip) and screenshots (optional)
